pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  # Fixed categories keep IDs, query strings and tokens out of logs/metric labels.
  map $uri $clinic_category {
    default static;
    /health health;
    ~^/api/ api;
  }
  map $status $clinic_level { default INFO; ~^5 ERROR; }
  map $upstream_http_x_request_id $clinic_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
  }
  log_format clinic_json escape=json '{"timestamp":"$time_iso8601","level":"$clinic_level",'
    '"service":"frontend","message":"http_request","category":"$clinic_category",'
    '"status":"$status","duration":$request_time,"request_id":"$clinic_request_id"}';
  access_log /dev/stdout clinic_json;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    location /api/ {
      set $api_backend api:8000;
      proxy_pass http://$api_backend;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $http_x_request_id;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
