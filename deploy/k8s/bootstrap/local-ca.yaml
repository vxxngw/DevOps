apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: clinic-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clinic-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: An Uyen Lab Root CA
  secretName: clinic-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: clinic-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: clinic-lab-ca
spec:
  ca:
    secretName: clinic-root-ca
