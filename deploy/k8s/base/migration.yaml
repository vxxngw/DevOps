apiVersion: batch/v1
kind: Job
metadata:
  name: clinic-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/part-of: anuyen
    spec:
      serviceAccountName: clinic-app
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
      - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: ghcr.io/vxxngw/devops-app:UNRELEASED
        command:
        - alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 384Mi
