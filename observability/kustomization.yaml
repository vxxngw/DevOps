apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/resources.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files: [prometheus.yml=prometheus/prometheus.yml]
  - name: prometheus-rules
    namespace: monitoring
    files: [clinic.yml=prometheus/rules/clinic.yml]
  - name: grafana-datasources
    namespace: monitoring
    files: [datasources.yml=grafana/datasources.yml]
  - name: grafana-providers
    namespace: monitoring
    files: [providers.yml=grafana/providers.yml]
  - name: grafana-dashboards
    namespace: monitoring
    files: [operations.json=grafana/dashboards/operations.json]
  - name: fluentd-config
    namespace: logging
    files: [fluent.conf=efk/fluent.conf]
