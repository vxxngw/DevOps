<system>
  log_level warn
</system>
# Docker json-file driver: {"log":"<json line>\n","stream":"stdout","time":"..."}
<source>
  @type tail
  @id clinic_container_logs
  path /var/lib/docker/containers/*/*-json.log
  pos_file /buffers/clinic-tail.pos
  tag clinic.logs
  read_from_head true
  path_key source_path
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%z
    keep_time_key true
  </parse>
</source>
<filter clinic.logs>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%N%z
    keep_time_key true
  </parse>
</filter>
<filter clinic.logs>
  @type grep
  <regexp>
    key timestamp
    pattern /^\d{4}-\d{2}-\d{2}T/
  </regexp>
</filter>
<filter clinic.logs>
  @type record_transformer
  enable_ruby true
  <record>
    namespace staging
    pod ${record['source_path'].split('/')[-1].sub('-json.log','')[0,12]}
    container ${record['service'] || 'unknown'}
    environment ${record['environment'] || 'staging'}
    service ${record['service'] || 'unknown'}
    level ${record['level'] || 'UNKNOWN'}
    message ${record['message'] || 'container_log'}
  </record>
  remove_keys source_path,stream,time
</filter>
<filter clinic.logs>
  @type record_transformer
  remove_keys password,token,authorization,Authorization,email,recipient
</filter>
<match clinic.logs>
  @type copy
  <store>
    @type relabel
    @label @ELASTIC
  </store>
  <store>
    @type relabel
    @label @FRONTEND_METRICS
  </store>
</match>
<label @FRONTEND_METRICS>
  <filter clinic.logs>
    @type grep
    <regexp>
      key service
      pattern /^frontend$/
    </regexp>
    <regexp>
      key category
      pattern /^(api|static|health)$/
    </regexp>
  </filter>
  <filter clinic.logs>
    @type prometheus
    <labels>
      namespace $.namespace
      service frontend
      category $.category
    </labels>
    <metric>
      name clinic_frontend_requests_total
      type counter
      desc Structured frontend access requests
      <labels>
        status $.status
      </labels>
    </metric>
    <metric>
      name clinic_frontend_duration_seconds
      type histogram
      desc End to end frontend request duration including API proxy
      key duration
      buckets 0.005,0.025,0.1,0.5,1,2.5,5,10,30
    </metric>
  </filter>
  <match **>
    @type null
  </match>
</label>
<label @ELASTIC>
  <match clinic.logs>
    @type elasticsearch
    host "#{ENV['ELASTIC_HOST']}"
    port "#{ENV['ELASTIC_PORT']}"
    scheme http
    logstash_format true
    logstash_prefix clinic-logs
    suppress_type_name true
    verify_es_version_at_startup true
    default_elasticsearch_version 8
    # fluent-plugin-elasticsearch 5.4.3 hard-codes
    # `application/vnd.elasticsearch+json; compatible-with=9` on both Accept and
    # Content-Type, which Elasticsearch 8.15 rejects with
    # media_type_header_exception. The plugin exposes no option to downgrade
    # that header, so the local collector talks to Elasticsearch through the
    # small header-rewriting proxy in efk/es-proxy.py (compatible-with=8).
    # The Kubernetes deployment keeps talking to ES directly.
    reconnect_on_error true
    reload_connections false
    request_timeout 10s
    <buffer>
      @type file
      path /buffers/elastic
      flush_interval 2s
      chunk_limit_size 2m
      total_limit_size 64m
      retry_type exponential_backoff
      retry_max_interval 30s
      retry_timeout 24h
      overflow_action block
    </buffer>
  </match>
</label>
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
</source>
<source>
  @type prometheus_output_monitor
  interval 10
</source>
