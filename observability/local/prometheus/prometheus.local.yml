# Local Docker variant of observability/prometheus/prometheus.yml.
# Differences are limited to service discovery: Docker DNS names instead of
# kubernetes_sd_configs, and the local compose project instead of namespaces.
#
# /etc/prometheus/rules holds clinic.local.yml, derived from the production
# rule file by observability/local/derive_rules.py (only the cluster-only
# expectation recording rules are dropped). /etc/prometheus/local-rules holds
# the local-only switch rules in rules/local.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: anuyen-local
    runtime: docker-compose
rule_files:
- /etc/prometheus/rules/*.yml
- /etc/prometheus/local-rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: clinic
  static_configs:
  - targets:
    - api:8000
    - publisher:8001
    - worker:8002
    labels:
      namespace: staging
  relabel_configs:
  - source_labels: [__address__]
    regex: ([^:]+):.*
    target_label: service
    replacement: ${1}
  metric_relabel_configs:
  - regex: event_id|request_id|correlation_id|email|appointment_id
    action: labeldrop
  honor_labels: true
- job_name: rabbitmq-staging
  metrics_path: /metrics/per-object
  static_configs:
  - targets:
    - rabbitmq:15692
    labels:
      namespace: staging
      service: rabbitmq
- job_name: postgres-staging
  static_configs:
  - targets:
    - postgres-exporter:9187
    labels:
      namespace: staging
      service: postgres
- job_name: fluentd
  static_configs:
  - targets:
    - fluentd:24231
    labels:
      namespace: logging
      service: fluentd
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
