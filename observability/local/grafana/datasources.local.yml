apiVersion: 1
datasources:
- name: Prometheus
  uid: clinic-prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  editable: false
- name: Elasticsearch
  uid: clinic-elasticsearch
  type: elasticsearch
  access: proxy
  url: http://elasticsearch:9200
  database: "clinic-logs-*"
  jsonData:
    timeField: "@timestamp"
    esVersion: "8.15.3"
    logMessageField: message
    logLevelField: level
    maxConcurrentShardRequests: 5
  editable: false
