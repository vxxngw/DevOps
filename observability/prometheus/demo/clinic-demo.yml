groups:
- name: clinic-demo-staging
  rules:
  - alert: ClinicDemoHttpErrors
    expr: sum(rate(clinic_http_requests_total{namespace="staging",route=~"/api/.*",status=~"5.."}[1m])) > 0.016
    for: 15s
    labels:
      namespace: staging
      service: api
      severity: critical
      profile: demo
    annotations:
      summary: 'DEMO: lỗi HTTP staging'
      description: Chỉ bật trong diễn tập staging; chưa đo thời gian rollback.
      runbook_url: https://github.com/vxxngw/DevOps/blob/codex/milestone-4/docs/runbooks/alerts.md#http-errors
