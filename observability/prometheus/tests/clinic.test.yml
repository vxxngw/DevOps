rule_files:
- ../rules/clinic.yml
evaluation_interval: 15s
tests:
- name: Missing target is an outage, not a silent empty graph
  interval: 15s
  input_series:
  - series: up{job="clinic",namespace="staging",service="api"}
    values: 1x40
  - series: up{job="clinic",namespace="staging",service="publisher"}
    values: 1x40
  - series: up{job="clinic",namespace="staging",service="worker"}
    values: 1x4 stale
  - series: up{job="clinic",namespace="production",service="api"}
    values: 1x40
  - series: up{job="clinic",namespace="production",service="publisher"}
    values: 1x40
  - series: up{job="clinic",namespace="production",service="worker"}
    values: 1x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicServiceDown",alertstate="firing"})
    eval_time: 30s
    exp_samples: []
  - expr: count(ALERTS{alertname="ClinicServiceDown",alertstate="firing"})
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Business 5xx ratio must sustain for two minutes
  interval: 15s
  input_series:
  - series: clinic_http_requests_total{namespace="staging",route="/api/doctors",status="200"}
    values: 0+20x40
  - series: clinic_http_requests_total{namespace="staging",route="/api/doctors",status="503"}
    values: 0+2x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicHighHttpErrors",alertstate="firing"})
    eval_time: 1m
    exp_samples: []
  - expr: count(ALERTS{alertname="ClinicHighHttpErrors",alertstate="firing"})
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Health traffic must not trigger business HTTP error alert
  interval: 15s
  input_series:
  - series: clinic_http_requests_total{namespace="staging",route="/health",status="503"}
    values: 0+20x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicHighHttpErrors",alertstate="firing"})
    eval_time: 6m
    exp_samples: []
- name: Business latency uses duration buckets and real request count
  interval: 15s
  input_series:
  - series: clinic_http_requests_total{namespace="staging",route="/api/doctors",status="200"}
    values: 0+20x40
  - series: clinic_http_duration_seconds_bucket{namespace="staging",route="/api/doctors",le="1"}
    values: 0+0x40
  - series: clinic_http_duration_seconds_bucket{namespace="staging",route="/api/doctors",le="2"}
    values: 0+20x40
  - series: clinic_http_duration_seconds_bucket{namespace="staging",route="/api/doctors",le="+Inf"}
    values: 0+20x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicHighHttpLatency",alertstate="firing"})
    eval_time: 1m
    exp_samples: []
  - expr: count(ALERTS{alertname="ClinicHighHttpLatency",alertstate="firing"})
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Queue without consumer fires and clears when consumer recovers
  interval: 15s
  input_series:
  - series: rabbitmq_queue_messages{namespace="staging",vhost="clinic-staging",queue="clinic.staging.notifications"}
    values: 10x40
  - series: rabbitmq_queue_consumers{namespace="staging",vhost="clinic-staging",queue="clinic.staging.notifications"}
    values: 0x8 1x32
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicQueueNoConsumer",alertstate="firing"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="ClinicQueueNoConsumer",alertstate="firing"})
    eval_time: 3m
    exp_samples: []
- name: Sustained backlog is distinct from missing consumer
  interval: 15s
  input_series:
  - series: rabbitmq_queue_messages{namespace="staging",vhost="clinic-staging",queue="clinic.staging.notifications"}
    values: 101x40
  - series: rabbitmq_queue_consumers{namespace="staging",vhost="clinic-staging",queue="clinic.staging.notifications"}
    values: 1x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicQueueBacklog",alertstate="firing"})
    eval_time: 1m
    exp_samples: []
  - expr: count(ALERTS{alertname="ClinicQueueBacklog",alertstate="firing"})
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="ClinicQueueNoConsumer",alertstate="firing"})
    eval_time: 3m
    exp_samples: []
- name: Dead letter queue alerts after hold
  interval: 15s
  input_series:
  - series: rabbitmq_queue_messages{namespace="staging",vhost="clinic-staging",queue="clinic.staging.dlq"}
    values: 1x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicDlqNotEmpty",alertstate="firing"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Old outbox needs pending events
  interval: 15s
  input_series:
  - series: clinic_outbox_oldest_seconds{namespace="staging",pod="publisher-a"}
    values: 180x40
  - series: clinic_outbox_pending{namespace="staging",pod="publisher-a"}
    values: 1x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicOutboxOld",alertstate="firing"})
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
- name: No backup metric is a missing backup, not success
  interval: 15s
  input_series: []
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicBackupStale",alertstate="firing"})
    eval_time: 4m
    exp_samples: []
  - expr: count(ALERTS{alertname="ClinicBackupStale",alertstate="firing"})
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 2
- name: A recent successful backup suppresses stale alert
  interval: 15s
  input_series:
  - series: clinic_backup_last_success_timestamp_seconds{namespace="staging"}
    values: '0x40'
  - series: clinic_backup_last_success_timestamp_seconds{namespace="production"}
    values: '0x40'
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicBackupStale",alertstate="firing"})
    eval_time: 6m
    exp_samples: []
- name: Failed backup is not hidden by earlier success
  interval: 15s
  input_series:
  - series: clinic_backup_last_run_success{namespace="staging"}
    values: '0x40'
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicBackupFailed",alertstate="firing"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
- name: High CPU and RAM require a sustained signal
  interval: 15s
  input_series:
  - series: node_cpu_seconds_total{node="test-node",mode="idle"}
    values: 0+1x40
  - series: node_memory_MemAvailable_bytes{node="test-node"}
    values: 5x40
  - series: node_memory_MemTotal_bytes{node="test-node"}
    values: 100x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicHighNodeCpu",alertstate="firing"})
    eval_time: 2m
    exp_samples: []
  - expr: count(ALERTS{alertname="ClinicHighNodeCpu",alertstate="firing"})
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="ClinicHighNodeMemory",alertstate="firing"})
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Exporter healthy while database unavailable still alerts
  interval: 15s
  input_series:
  - series: pg_up{namespace="staging"}
    values: '0x40'
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicDatabaseDown",alertstate="firing"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Backend dependency failure has its own signal
  interval: 15s
  input_series:
  - series: clinic_dependency_ready{namespace="staging",service="worker",dependency="rabbitmq"}
    values: '0x40'
  promql_expr_test:
  - expr: count(ALERTS{alertname="ClinicDependencyDown",alertstate="firing"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
