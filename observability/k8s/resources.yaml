            path: /api/health
            port: 3000
          periodSeconds: 20
          failureThreshold: 5
      terminationGracePeriodSeconds: 60
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: providers
        configMap:
          name: grafana-providers
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      nodeSelector:
        clinic.anuyen.io/storage: 'true'
