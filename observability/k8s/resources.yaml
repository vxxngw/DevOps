apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537
        ports:
        - name: http
          containerPort: 9200
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 1536Mi
        env:
        - name: discovery.type
          value: single-node
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elastic-admin
              key: password
        - name: xpack.security.enabled
          value: 'true'
        - name: xpack.security.enrollment.enabled
          value: 'false'
        - name: xpack.security.http.ssl.enabled
          value: 'true'
        - name: xpack.security.http.ssl.key
          value: tls/tls.key
        - name: xpack.security.http.ssl.certificate
          value: tls/tls.crt
        - name: xpack.security.http.ssl.certificate_authorities
          value: tls/ca.crt
        - name: xpack.security.transport.ssl.enabled
          value: 'true'
        - name: xpack.security.transport.ssl.key
          value: tls/tls.key
        - name: xpack.security.transport.ssl.certificate
          value: tls/tls.crt
        - name: xpack.security.transport.ssl.certificate_authorities
          value: tls/ca.crt
        - name: xpack.security.transport.ssl.verification_mode
          value: certificate
        volumeMounts:
        - name: elasticsearch-tls
          mountPath: /usr/share/elasticsearch/config/tls
          readOnly: true
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        startupProbe:
          tcpSocket:
            port: 9200
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 9200
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9200
          periodSeconds: 20
          failureThreshold: 5
      terminationGracePeriodSeconds: 60
      volumes:
      - name: elasticsearch-data
        persistentVolumeClaim:
          claimName: elasticsearch-data
      - name: elasticsearch-tls
        secret:
          secretName: elasticsearch-tls
          defaultMode: 288
      nodeSelector:
        clinic.anuyen.io/storage: 'true'
  replicas: 1
  serviceName: elasticsearch
