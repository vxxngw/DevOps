---
- name: Chờ k3s server sẵn sàng
  ansible.builtin.wait_for:
    host: "{{ k3s_server_ip }}"
    port: 6443
    timeout: 300

- name: Tạo thư mục cấu hình k3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Ghi cấu hình k3s agent (chứa token từ Vault)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Tải script cài k3s
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: "{{ k3s_install_script }}"
    mode: "0755"

- name: Cài k3s agent (chỉ chạy khi chưa có binary)
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: agent

- name: Bật service k3s-agent
  ansible.builtin.service:
    name: k3s-agent
    state: started
    enabled: true
