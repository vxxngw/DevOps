---
- name: Cài Docker (gói docker.io của Ubuntu)
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Bật Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Cho user vào nhóm docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
