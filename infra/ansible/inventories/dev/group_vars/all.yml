# Dev = VirtualBox host-only fleet; lab = Terraform/libvirt fleet. Each inventory
# has its own hosts, operator CIDR and Vault file, so secrets never cross envs.
# Staging and production stay namespaces in ONE cluster, not separate fleets.
# 192.168.56.1 is the VirtualBox host-only adapter on the operator machine.
clinic_operator_cidrs: [192.168.56.1/32]
clinic_pod_cidr: 10.42.0.0/16
clinic_service_cidr: 10.43.0.0/16
clinic_repo_url: https://github.com/vxxngw/DevOps.git
clinic_repo_dir: /opt/anuyen-src
clinic_backup_root: /srv/clinic-backups
clinic_backup_retention_days: 3
clinic_vault_file: "{{ inventory_dir }}/vault.yml"
# Required actual inputs: clinic_operator_public_key, clinic_repo_revision (40hex),
# and a Vault-encrypted dev/vault.yml (separate from lab/vault.yml).
