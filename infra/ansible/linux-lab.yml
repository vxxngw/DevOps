# Bai 3 on ONE VirtualBox VM (scripts/infra/vbox-lab.py): hardened Linux baseline (user, SSH key,
# no root, UFW), host health timer, Compose PostgreSQL with synthetic data and a scheduled backup.
# The k3s cluster stays in site.yml.
- name: Linux baseline, dev database and scheduled backup on the lab VM
  hosts: linux_lab
  become: true
  environment:
    LC_ALL: C
  vars:
    clinic_versions: "{{ lookup('file', playbook_dir + '/../versions.json') | from_json }}"
    clinic_backup_profiles: [dev]
    clinic_backup_command: "{{ clinic_repo_dir }}/scripts/infra/backup.sh"
  pre_tasks:
    - name: Require an exact revision to deploy
      ansible.builtin.assert:
        that: clinic_repo_revision is match('^[0-9a-f]{40}$')
  roles:
    - common
    - docker
    - backup
  tasks:
    - name: Checkout exact project revision
      ansible.builtin.git:
        repo: "{{ clinic_repo_url }}"
        dest: "{{ clinic_repo_dir }}"
        version: "{{ clinic_repo_revision }}"
        force: false
    - name: Create random synthetic dev credentials once
      ansible.builtin.command:
        cmd: python3 scripts/dev/init-env.py
        chdir: "{{ clinic_repo_dir }}"
        creates: "{{ clinic_repo_dir }}/.env"
    - name: Keep dev credentials readable by root only
      ansible.builtin.file: {path: "{{ clinic_repo_dir }}/.env", mode: '0600'}
    - name: Start PostgreSQL and wait until healthy
      community.docker.docker_compose_v2:
        project_src: "{{ clinic_repo_dir }}"
        services: [postgres]
        pull: never  # images are built from this checkout, never pulled
        wait: true
    # alembic.ini has no logging config, so compare `alembic current` before/after to report a change.
    - name: Apply database migrations
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm -T migrate sh -c
          'before=$(alembic current) && alembic upgrade head && after=$(alembic current)
          && { [ "$before" = "$after" ] || echo SCHEMA_CHANGED; }'
        chdir: "{{ clinic_repo_dir }}"
      register: clinic_migrate
      changed_when: "'SCHEMA_CHANGED' in clinic_migrate.stdout"
    - name: Count synthetic doctors
      ansible.builtin.command:
        cmd: docker compose exec -T postgres psql -U clinic -d clinic -Atc 'select count(*) from doctors'
        chdir: "{{ clinic_repo_dir }}"
      register: clinic_doctor_count
      changed_when: false  # read-only query
    # Seed prints nothing; it is idempotent but only needed while the database is empty.
    - name: Load synthetic seed data into an empty database
      ansible.builtin.command:
        cmd: docker compose run --rm -T seed
        chdir: "{{ clinic_repo_dir }}"
      when: clinic_doctor_count.stdout == '0'
