- name: Configure operating system and exporter on all three VMs
  hosts: all
  tags:
  - os
  become: true
  environment:
    LC_ALL: C
  vars:
    clinic_versions: '{{ lookup(''file'', playbook_dir + ''/../versions.json'') |
      from_json }}'
  roles:
  - common
  - node_exporter
- name: Install dedicated Jenkins controller and build agent
  hosts: jenkins
  tags:
  - ci
  become: true
  vars:
    clinic_versions: '{{ lookup(''file'', playbook_dir + ''/../versions.json'') |
      from_json }}'
  pre_tasks:
  - name: Require and load encrypted Vault input
    ansible.builtin.import_tasks: tasks/load-vault.yml
  roles:
  - docker
  - jenkins
- name: Install k3s server before any agent can join
  hosts: k3s_server
  tags:
  - cluster
  become: true
  serial: 1
  vars:
    clinic_versions: '{{ lookup(''file'', playbook_dir + ''/../versions.json'') |
      from_json }}'
  pre_tasks:
  - name: Require and load encrypted Vault input
    ansible.builtin.import_tasks: tasks/load-vault.yml
  roles:
  - k3s
  - backup
- name: Join k3s agent after server play completes
  hosts: k3s_agent
  tags:
  - cluster
  become: true
  vars:
    clinic_versions: '{{ lookup(''file'', playbook_dir + ''/../versions.json'') |
      from_json }}'
  pre_tasks:
  - name: Require and load encrypted Vault input
    ansible.builtin.import_tasks: tasks/load-vault.yml
  roles:
  - k3s
