---
- name: Prepare Docker apt keyring
  ansible.builtin.file: {path: /etc/apt/keyrings, state: directory, mode: '0755'}
- name: Install official Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ clinic_versions.docker_gpg_sha256 }}"
    mode: '0644'
- name: Add Ubuntu24.04 Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
  register: clinic_docker_repository
- name: Install pinned Docker and Compose packages
  ansible.builtin.apt:
    name: "{{ clinic_versions.docker_apt_packages | dict2items | map(attribute='key') | zip(clinic_versions.docker_apt_packages | dict2items | map(attribute='value')) | map('join', '=') | list }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if clinic_docker_repository.changed else 3600 }}"
- name: Start Docker
  ansible.builtin.systemd_service: {name: docker, enabled: true, state: started}
# Operator is intentionally not added to the root-equivalent docker group.
