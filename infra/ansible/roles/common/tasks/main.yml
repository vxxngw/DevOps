---
- name: Ensure operator login is already established
  ansible.builtin.assert:
    that:
      - ansible_user == 'clinicops'
      - clinic_operator_public_key is defined
      - clinic_operator_cidrs | length > 0
      - "'0.0.0.0/0' not in clinic_operator_cidrs"
- name: Install OS prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, openssh-server, python3, python3-venv, ufw]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Ensure operating user
  ansible.builtin.user:
    name: clinicops
    groups: sudo
    append: true
    shell: /bin/bash
- name: Install actual operator public key
  ansible.posix.authorized_key:
    user: clinicops
    key: "{{ clinic_operator_public_key }}"
    state: present
- name: Configure key-only SSH without root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-clinic.conf
    mode: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_set: true
    reload: true
- name: Load CNI kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]
- name: Enable bridge packet filtering for CNI
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  loop: [net.bridge.bridge-nf-call-iptables, net.bridge.bridge-nf-call-ip6tables]
- name: Default deny inbound
  community.general.ufw: {direction: incoming, policy: deny}
- name: Permit outgoing
  community.general.ufw: {direction: outgoing, policy: allow}
- name: Permit routed pod traffic, isolated further by Kubernetes policies
  community.general.ufw: {direction: routed, policy: allow}
- name: Permit SSH before enabling firewall
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: '22'
    proto: tcp
  loop: "{{ clinic_operator_cidrs }}"
- name: Permit node exporter only from lab nodes
  community.general.ufw:
    rule: allow
    from_ip: "{{ clinic_node_cidr }}"
    port: '9100'
    proto: tcp
- name: Permit monitoring pod access to node exporter and kubelet
  community.general.ufw:
    rule: allow
    from_ip: "{{ clinic_pod_cidr }}"
    port: "{{ item }}"
    proto: tcp
  loop: ['9100', '10250']
- name: Configure Elasticsearch memory map capacity on cluster nodes
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '1048576'
    state: present
    sysctl_set: true
    reload: true
  when: inventory_hostname in groups.get('k3s_server', []) + groups.get('k3s_agent', [])
- name: Create bounded Fluentd buffer directory on cluster nodes
  ansible.builtin.file:
    path: /var/lib/anuyen-fluentd
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: inventory_hostname in groups.get('k3s_server', []) + groups.get('k3s_agent', [])
- name: Permit private k3s node traffic
  community.general.ufw:
    rule: allow
    from_ip: "{{ clinic_node_cidr }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: [{port: '6443', proto: tcp}, {port: '10250', proto: tcp}, {port: '8472', proto: udp}, {port: '80', proto: tcp}, {port: '443', proto: tcp}]
  when: inventory_hostname in groups.get('k3s_server', []) + groups.get('k3s_agent', [])
- name: Permit API and HTTPS access from operator networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1 }}"
    proto: tcp
  loop: "{{ clinic_operator_cidrs | product(['6443', '80', '443']) | list }}"
  when: inventory_hostname in groups.get('k3s_server', []) + groups.get('k3s_agent', [])
- name: Enable firewall
  community.general.ufw: {state: enabled}
