---
# Defaults: staging/production via kubectl on the k3s server. cloud-lab.yml overrides with the dev profile.
- name: Create backup root
  ansible.builtin.file: {path: "{{ clinic_backup_root }}", state: directory, mode: '0700'}
- name: Install operational scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/infra/{{ item }}"
    dest: "/usr/local/sbin/clinic-{{ item }}"
    mode: '0750'
  loop: [backup.sh, restore.sh, backup-common.sh]
- name: Install backup service
  ansible.builtin.template:
    src: clinic-backup@.service.j2
    dest: /etc/systemd/system/clinic-backup@.service
    mode: '0644'
  notify: Reload systemd for backups
- name: Install backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/clinic-backup@.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Scheduled clinic database backup %i
      [Timer]
      OnCalendar={{ clinic_backup_on_calendar | default('*-*-* 02:15:00') }}
      RandomizedDelaySec=300
      Persistent=true
      [Install]
      WantedBy=timers.target
  notify: Reload systemd for backups
- name: Enable backup schedules
  ansible.builtin.systemd_service:
    name: "clinic-backup@{{ item }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ clinic_backup_profiles | default(['staging', 'production']) }}"
