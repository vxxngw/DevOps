---
- name: Validate cluster secret and server inventory
  ansible.builtin.assert:
    that:
      - vault_k3s_token | length >= 32
      - groups.k3s_server | length == 1
  no_log: true
- name: Download versioned k3s binary with upstream checksum
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ clinic_versions.k3s }}/k3s"
    checksum: "sha256:https://github.com/k3s-io/k3s/releases/download/{{ clinic_versions.k3s }}/sha256sum-amd64.txt"
    dest: /usr/local/bin/k3s
    mode: '0755'
  notify: Restart k3s
- name: Link kubectl command
  ansible.builtin.file: {src: /usr/local/bin/k3s, dest: /usr/local/bin/kubectl, state: link}
- name: Create k3s configuration directory
  ansible.builtin.file: {path: /etc/rancher/k3s, state: directory, mode: '0700'}
- name: Write role-specific k3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
  no_log: true
  notify: Restart k3s
- name: Install k3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: '0644'
  notify: Restart k3s
- name: Apply pending service changes
  ansible.builtin.meta: flush_handlers
- name: Enable and start k3s
  ansible.builtin.systemd_service: {name: k3s, enabled: true, state: started, daemon_reload: true}
- name: Wait for API before joining agents
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups.k3s_server[0]].ansible_host }}"
    port: 6443
    timeout: 180
- name: Verify server readiness
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_ready
  changed_when: false
  until: k3s_ready.rc == 0
  retries: 30
  delay: 5
  when: inventory_hostname in groups.k3s_server
- name: Verify joined node readiness through the server
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, wait, '--for=condition=Ready', 'node/{{ inventory_hostname }}', '--timeout=180s']
  delegate_to: "{{ groups.k3s_server[0] }}"
  changed_when: false
